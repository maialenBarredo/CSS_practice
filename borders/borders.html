<!DOCTYPE html>

<html lang="en">

<head>
    <!-- Hace que el diseño use el ancho real del móvil. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>border types and border radius</title>
    <link rel="icon" href="../images/css.png">
    <link rel="stylesheet" href="borders.css">
</head>

<body>
    <header>
        <h1> MANERAS DE PONER DISTINTOS RADIOS AL BORDE DE UN DIV</h1>
    </header>
    <main>
        <section>
            <div class="square">
                <span>border-radius: 8px</span>
            </div>

            <div class="square-2">
                <span>border-radius: 20px</span>
            </div>

            <div class="circle">
                <span>border-radius: 50%</span>
            </div>

            <div class="square-3">
                <p>border-radius:</p>
                <p>12px 28px</p>
            </div>

            <div class="square-4">
                <p>border-radius:</p>
                <p>0 40px</p>
            </div>

            <div class="square-5">
                <p>border-radius:</p>
                <p>6px 20px 40px 8px</p> <!-- arriba izquierda - arriba derecha - abajo derecha - abajo izquierda-->
            </div>

        </section>
    </main>
</body>

</html>
